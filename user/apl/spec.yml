states:
  ctrl_promyelocytes: ctrl_prom1
  ctrl_proliferation: ctrl_rep
  ctrl_apoptosis: ctrl_apo
  ctrl_intermediary: ctrl_prom2
  ctrl_differentiation: ctrl_gran2
  treated_promyelocytes: treated_prom1
  treated_proliferation: treated_rep
  treated_differentiation: treated_gran2
  treated_intermediary: treated_prom2
bonesis:
  - ctrl_proliferation = bo.fixed(~bo.obs('ctrl_proliferation'))
  - ctrl_apoptosis = bo.fixed(~bo.obs('ctrl_apoptosis'))
  - ctrl_differentiation = bo.fixed(~bo.obs('ctrl_differentiation'))
  - treated_proliferation = bo.fixed(~bo.obs('treated_proliferation'))
  - treated_differentiation = bo.fixed(~bo.obs('treated_differentiation'))
  - ctrl_proliferation != ctrl_apoptosis
  - ctrl_proliferation != ctrl_differentiation
  - ctrl_apoptosis != ctrl_differentiation
  - ctrl_differentiation != treated_differentiation
  - treated_proliferation != treated_differentiation
  - ~bo.obs('ctrl_promyelocytes') != ~bo.obs('treated_promyelocytes')
  - ~bo.obs('ctrl_promyelocytes') >= ctrl_proliferation
  - ~bo.obs('ctrl_promyelocytes') >= ~bo.obs('ctrl_intermediary') >= ctrl_apoptosis
  - ~bo.obs('ctrl_intermediary') >= ctrl_differentiation
  - ~bo.obs('treated_promyelocytes') >= treated_proliferation
  - ~bo.obs('treated_promyelocytes') >= ~bo.obs('treated_intermediary') >= treated_differentiation
  - ~bo.obs('ctrl_intermediary') // ctrl_proliferation
  - ~bo.obs('ctrl_intermediary') // treated_proliferation
  - ~bo.obs('ctrl_intermediary') // treated_differentiation
  - ~bo.obs('treated_intermediary') // ctrl_proliferation
  - ~bo.obs('treated_intermediary') // treated_proliferation
  - ~bo.obs('treated_intermediary') // ctrl_apoptosis
  - ~bo.obs('treated_intermediary') // ctrl_differentiation
  - ~bo.obs('ctrl_promyelocytes') >> 'fixpoints' ^ {bo.obs('ctrl_apoptosis'), bo.obs('ctrl_proliferation'), bo.obs('ctrl_differentiation')}
  - ~bo.obs('treated_promyelocytes') >> 'fixpoints' ^ {bo.obs('treated_differentiation'), bo.obs('treated_proliferation')}
