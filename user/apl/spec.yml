states:
bonesis:
# configurations
  - ctrl_prom1 = ~bo.obs('ctrl_Prom1')
  - ctrl_prom2 = ~bo.obs('ctrl_Prom2')
  - ctrl_rep = bo.fixed(bo.obs('ctrl_Rep'))
  - ctrl_neu = bo.fixed(~bo.obs('ctrl_Neu'))
  - ctrl_alt = bo.fixed(~bo.obs('ctrl_Alt'))
  - treated_prom1 = ~bo.obs('treated_Prom1')
  - treated_prom2 = ~bo.obs('treated_Prom2')
  - treated_rep = bo.fixed(bo.obs('treated_Rep'))
  - treated_neu = bo.fixed(~bo.obs('treated_Neu'))
# inequalities
  - ctrl_prom1 != treated_prom1
  - ctrl_neu != bo.obs('ctrl_Rep')
  - ctrl_alt != bo.obs('ctrl_Rep')
  - treated_neu != bo.obs('treated_Rep')
# positive reachability
  - ctrl_prom1 >= ctrl_rep
  - ctrl_prom1 >= ctrl_prom2 >= ctrl_neu
  - ctrl_prom2 >= ctrl_alt
  - treated_prom1 >= treated_rep
  - treated_prom1 >= treated_prom2 >= treated_neu
# negative reachability
  - ctrl_prom2 / ctrl_rep
  - ctrl_prom2 / treated_rep
  - treated_prom2 / ctrl_rep
  - treated_prom2 / treated_rep
  - ctrl_prom1 / treated_neu
  - treated_prom1 / ctrl_neu
  - treated_prom1 / ctrl_alt
# universal constraints
  - ctrl_prom1 >> 'fixpoints' ^ {bo.obs('ctrl_Rep'), bo.obs('ctrl_Neu'), bo.obs('ctrl_Alt')}
  - treated_prom1 >> 'fixpoints' ^ {bo.obs('treated_Rep'), bo.obs('treated_Neu')}
