name: tests

on:
  push:
  pull_request:

jobs:
  make-help:
    name: Make help
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - run: make help >/dev/null

  make-show-config:
    name: Make show-config
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - run: make show-config PARAMS=user/apl/params.mk >/dev/null

  python-compile:
    name: Python compileall
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m compileall lib scripts fig

  scbolt-cli:
    name: scBOLT CLI wrapper
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - run: bash tests/test_scbolt_cli.sh

  dry-run-knnbs:
    name: Dry-run knnbs
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - run: make --always-make --dry-run LOGGING=false __knnbs PARAMS=user/apl/params.mk >/dev/null

  dry-run-seed:
    name: Dry-run max-nodes-seed
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - run: make --always-make --dry-run LOGGING=false __max-nodes-seed PARAMS=user/apl/params.mk >/dev/null

  check-knnbs:
    name: Check knnbs
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - run: make check TARGET=knnbs PARAMS=user/apl/params.mk __check_externals__=false

  check-seed:
    name: Check max-nodes-seed
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - run: make check TARGET=max-nodes-seed PARAMS=user/apl/params.mk __check_externals__=false

  diagnostic-knnbs:
    name: Diagnostic missing knnbs parameters
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Check complete diagnostic output
        run: |
          set +e
          output="$(make check TARGET=knnbs PARAMS=user/apl/params.mk __check_externals__=false KNNBS_CENTRALITY_CTRL= KNNBS_PERIPHERY_CTRL= KNNBS_CENTRALITY_TREATED= KNNBS_PERIPHERY_TREATED= 2>&1)"
          status="$?"
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          grep -q "required method parameter not defined: KNNBS_CENTRALITY_CTRL or KNNBS_PERIPHERY_CTRL" <<< "$output"
          grep -q "required method parameter not defined: KNNBS_CENTRALITY_TREATED or KNNBS_PERIPHERY_TREATED" <<< "$output"
          grep -q "check failed for target 'knnbs'" <<< "$output"

  diagnostic-seed:
    name: Diagnostic missing seed inputs
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Check complete diagnostic output
        run: |
          set +e
          output="$(make check TARGET=max-nodes-seed PARAMS=user/apl/params.mk __check_externals__=false TIMEOUT_SEED= SPEC_FILE=missing.yml 2>&1)"
          status="$?"
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          grep -qE "required file not found: .*missing.yml" <<< "$output"
          grep -q "required method parameter not defined: TIMEOUT_SEED" <<< "$output"
          grep -q "check failed for target 'max-nodes-seed'" <<< "$output"
