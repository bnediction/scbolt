name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - run: bash tests/unit/test_clause_continuation.sh
      - run: bash tests/unit/test_trust_existing.sh
      - run: python3 tests/unit/test_domain_continuation.py
      - run: python3 tests/unit/test_expression_layers.py
      - run: bash tests/unit/test_forbidden_nodes.sh
      - run: python3 tests/unit/test_solver_timeout.py
      - run: python3 tests/unit/test_subset_minimal_parallel.py
      - run: bash tests/unit/test_memory.sh

  smoke:
    name: Smoke tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: make help >/dev/null
      - run: make config PARAMS=tests/fixtures/params.mk >/dev/null
      - run: python -m compileall lib scripts
      - run: bash tests/smoke/test_scbolt_cli.sh

  compatibility:
    name: Compatibility tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - run: bash tests/compatibility/test_install_backend_config.sh
      - run: bash tests/compatibility/test_backend_precedence.sh
      - run: bash tests/compatibility/test_system_tools_fallback.sh

  compatibility-env:
    name: Compatibility env (${{ matrix.backend }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        backend:
          - conda
          - mamba
          - micromamba
    env:
      CONDA_ENVS_PATH: ${{ github.workspace }}/.conda-envs
      MAMBA_ROOT_PREFIX: ${{ github.workspace }}/.micromamba
    steps:
      - uses: actions/checkout@v6
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          auto-activate: false
          channels: conda-forge
          conda-remove-defaults: true
          use-mamba: true
      - name: Install backend commands
        shell: bash -el {0}
        run: |
          conda install -n base -c conda-forge mamba -y
          if ! command -v micromamba >/dev/null 2>&1; then
            tmpdir="$(mktemp -d)"
            curl -Ls https://micro.mamba.pm/api/micromamba/linux-64/latest \
              | tar -xj -C "${tmpdir}" bin/micromamba
            mkdir -p "${HOME}/.local/bin"
            install -m 755 "${tmpdir}/bin/micromamba" "${HOME}/.local/bin/micromamba"
            echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
            export PATH="${HOME}/.local/bin:${PATH}"
            rm -rf "${tmpdir}"
          fi
          conda --version
          mamba --version
          micromamba --version
      - name: Restore scbolt-system cache
        id: cache-system
        uses: actions/cache@v6
        with:
          path: |
            .conda-envs/scbolt-system
            .micromamba/envs/scbolt-system
          key: scbolt-system-${{ runner.os }}-${{ matrix.backend }}-${{ hashFiles('envs/conda/system.yml') }}
      - name: Install and check scbolt-system
        shell: bash -el {0}
        env:
          SCBOLT_TEST_BACKEND: ${{ matrix.backend }}
          SCBOLT_SKIP_ENV_INSTALL: ${{ steps.cache-system.outputs.cache-hit }}
        run: bash tests/compatibility/test_backend_system_env.sh

  compatibility-docker:
    name: Compatibility Docker image
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: envs/docker/Dockerfile
          tags: scbolt:test-system
          load: true
          push: false
          build-args: |
            SCBOLT_ENV_FILES=system
            SCBOLT_GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker run --rm scbolt:test-system --version

  regression:
    name: Regression tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install pandas
      - run: python tests/regression/test_annotation_composition.py
      - run: bash tests/regression/test_clean_sidecars.sh
      - run: bash tests/regression/test_gene_selection_partial_outputs.sh
      - run: bash tests/regression/test_inference_timeout.sh
      - run: bash tests/regression/test_matrix_entry.sh
      - run: bash tests/regression/test_bn_output_check.sh
      - run: make --always-make --dry-run LOGGING=false __knnsc PARAMS=tests/fixtures/params.mk >/dev/null
      - run: make --always-make --dry-run LOGGING=false __max-nodes-seed PARAMS=tests/fixtures/params.mk >/dev/null
      - run: make check TARGET=knnsc PARAMS=tests/fixtures/params.mk __check_externals__=false
      - run: make check TARGET=max-nodes-seed PARAMS=tests/fixtures/params.mk __check_externals__=false
      - name: Check complete knnsc diagnostic output
        run: |
          set +e
          output="$(make check TARGET=knnsc PARAMS=tests/fixtures/params.mk __check_externals__=false KNNSC_CENTRALITY_CTRL= KNNSC_PERIPHERY_CTRL= KNNSC_CENTRALITY_TREATED= KNNSC_PERIPHERY_TREATED= 2>&1)"
          status="$?"
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          grep -q "required method parameter not defined: KNNSC_CENTRALITY_CTRL or KNNSC_PERIPHERY_CTRL" <<< "$output"
          grep -q "required method parameter not defined: KNNSC_CENTRALITY_TREATED or KNNSC_PERIPHERY_TREATED" <<< "$output"
          grep -q "check failed for target 'knnsc'" <<< "$output"
      - name: Check complete max-nodes-seed diagnostic output
        run: |
          set +e
          output="$(make check TARGET=max-nodes-seed PARAMS=tests/fixtures/params.mk __check_externals__=false TIMEOUT_SEED= SPEC_FILE=missing.yml 2>&1)"
          status="$?"
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          grep -qE "required file not found: .*missing.yml" <<< "$output"
          grep -q "required method parameter not defined: TIMEOUT_SEED" <<< "$output"
          grep -q "check failed for target 'max-nodes-seed'" <<< "$output"
