# Compact Nestorowa tutorial using prepared Boolean inputs.
organism: mouse
conditions: []
project-dir: project
binarization-file: data/mstates_bin.csv
spec-file: spec.yml

jobs: 4
memory: 8
seed: 10

geneinfo-version: bundled
prior-knowledge: data/interactions.csv

# Keep the tutorial focused on staged node selection and BN enumeration.
strong-constants-scope: none
max-clauses: 5
bounded-nonreach: 20
inference-limit: 10

timeout-relaxed: 2m
timeout-seed: 5m
timeout-lock: "0"

# These strategies were the fastest on this compact domain.
clingo-mode-relaxed: optN
clingo-strategy-relaxed: usc
clingo-mode-seed: opt
clingo-strategy-seed: bb,inc

clause-continuation-soft: false
domain-continuation-soft: false
clause-continuation-relaxed: false
domain-continuation-relaxed: false
clause-continuation-seed: false
domain-continuation-seed: false
clause-continuation-lock: false
domain-continuation-lock: false
